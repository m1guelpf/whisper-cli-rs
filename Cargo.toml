[package]
license = "MIT"
edition = "2021"
version = "0.1.0"
name = "whisper_cli"
readme = "README.md"
homepage = "https://github.com/m1guelpf/whisper-cli-rs"
description = "A command line interface for whisper-rs"
repository = "https://github.com/m1guelpf/whisper-cli-rs"
authors = ["Miguel Piedrafita <soy@miguelpiedrafita.com>"]
keywords = ["whisper", "openai", "cli", "transcribe"]
categories = ["command-line-utilities"]

[[bin]]
name = "whisper"
path = "src/main.rs"

[workspace]

[dependencies]
num = "0.4.1"
dirs = "5.0.1"
anyhow = "1.0.75"
indicatif = "0.17.6"
async-trait = "0.1"
futures-util = "0.3.28"
uuid = { version = "1.4.1", features = ["v4"] }
tokio = { version = "1.32.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
clap = { version = "4.4.3", features = ["derive"] }
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0"
moonshine-rs = { version = "0.2.6", default-features = false }
reqwest = { version = "0.11.20", features = ["blocking", "stream", "multipart", "json"] }
audrey = { version = "0.3.0", default-features = false, features = ["wav"] }
